name: County news refresh

on:
  schedule:
    - cron: '17 10 * * *'   # daily, about 6:17 AM Eastern
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: county-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch county news
        run: node scripts/update-county-news.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet src/data/county-news.json; then
            echo "No news changes."; exit 0
          fi
          # Author must be the stairwaymortgage account or Vercel Hobby skips the deploy.
          git config user.name "stairwaymortgage"
          git config user.email "228726121+stairwaymortgage@users.noreply.github.com"
          git add src/data/county-news.json
          git commit -m "chore(county-news): daily refresh $(date -u +%F)"
          git push
