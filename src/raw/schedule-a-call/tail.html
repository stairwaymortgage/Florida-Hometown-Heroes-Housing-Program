  <!-- Shared lead pipeline: needed for FHTH.getAttribution() below. -->
  <script src="/js/lead.js"></script>
  <script>
    // Booking flow lives on an external domain — attribution won't carry across
    // the jump on its own. Rebuild the outbound href at runtime from this
    // session's stored first-touch attribution so every click carries it.
    (function () {
      var link = document.getElementById('book-call');
      if (!link || !window.FHTH || !FHTH.getAttribution) return;
      var a = FHTH.getAttribution();
      var params = new URLSearchParams();
      if (a.utm_source)   params.set('utm_source', a.utm_source);
      if (a.utm_medium)   params.set('utm_medium', a.utm_medium);
      if (a.utm_campaign) params.set('utm_campaign', a.utm_campaign);
      if (a.gclid)        params.set('gclid', a.gclid);
      params.set('src', 'schedule-page');
      link.href = 'https://stairwaymortgage.com/schedule-call?' + params.toString();
    })();
  </script>
